name = "license-worker"
main = "src/worker.js"
compatibility_date = "2026-05-30"

workers_dev = true

[vars]
ALLOWED_ORIGIN = "*"
# Sender must be on a domain onboarded to Cloudflare Email Sending (apply-ease.com).
FEEDBACK_FROM_EMAIL = "feedback@apply-ease.com"
# The recipient is NOT set here: this repo is public. Set it as a secret:
#   npx wrangler secret put SUPPORT_EMAIL
# Feedback fails closed (HTTP 503) until both the binding and SUPPORT_EMAIL exist.

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "applyease-license"
database_id = "1ea2cd29-a816-4729-b0cc-d82340c01830"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "c6e1397eb0f042759486e2d52c94a92c"
preview_id = "8ee13f6882734c8c9ab9ac2949434cbf"
